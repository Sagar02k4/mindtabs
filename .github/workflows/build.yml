name: Build validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build extension and auth portal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Extension
            working-directory: .
          - name: WebAuthPortal
            working-directory: WebAuthPortal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            WebAuthPortal/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.working-directory }}
        run: npm run build

      - name: Lint auth portal
        if: matrix.name == 'WebAuthPortal'
        run: npm run lint

      - name: Dependency audit
        if: matrix.name == 'Extension'
        run: npm audit --omit=dev --audit-level=high

      - name: Development dependency audit report
        if: matrix.name == 'Extension'
        run: npm audit --audit-level=high || true

      - name: Test and type-check extension
        if: matrix.name == 'Extension'
        run: npm run test && npm run typecheck
